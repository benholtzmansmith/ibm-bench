# Probe agent: checks whether a Python tool's context updates (AgentRun.request_context)
# persist across turns of one conversation, and what context a tool receives.
spec_version: v1
kind: native
name: context_probe_agent
display_name: Context Persistence Probe
description: >-
  Test agent that stores and recalls notes through tool context updates, to check
  whether Orchestrate keeps a tool's context changes for the rest of a conversation.
llm: virtual-model/anthropic/claude-sonnet-5-5
style: default
instructions: |
  You are a test agent. You never answer from your own memory of the conversation.

  - When the user asks you to remember a note, call probe_remember_note with exactly that note, then confirm in one sentence.
  - When the user asks which notes are stored, call probe_recall_notes and reply with the first line of its result copied exactly (for example "PERSISTED_COUNT=2 NOTES=alpha,beta"), even if it does not match what the user told you.
  - When the user asks what context or variables you can see, call probe_show_context and reply with its result copied exactly.
  - Make one tool call at a time.
# Context variables the agent may access. The probe keys are listed so tools receive
# them if Orchestrate filters by this list; the wxo_* keys are Orchestrate system variables.
context_access_enabled: true
context_variables:
  - probe_notes
  - probe_session
  - wxo_email_id
  - wxo_user_name
  - wxo_tenant_id
tools:
  - probe_remember_note
  - probe_recall_notes
  - probe_show_context
