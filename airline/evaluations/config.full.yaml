# ADK evaluation config (full run). Run from the repo root:
#   orchestrate evaluations evaluate -c airline/evaluations/config.full.yaml
auth_config:
  url: http://localhost:4321
  tenant_name: local
test_paths:
  - airline/evaluations/test_cases
output_dir: results/full
# The simulated user and the judge both call the virtual model through the
# local Orchestrate AI gateway, so no separate provider key is needed.
llm_user_config:
  provider_config:
    provider: gateway
    model_id: virtual-model/anthropic/claude-sonnet-5-5
evaluation_config:
  provider_config:
    provider: gateway
    model_id: virtual-model/anthropic/claude-sonnet-5-5
max_user_turns: 30
num_workers: 2
