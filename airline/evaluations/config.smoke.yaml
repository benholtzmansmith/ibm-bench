# ADK evaluation config (smoke run). Run from the repo root with scripts/run_evals.sh.
# There is no auth_config, so the evaluation targets the active orchestrate
# environment: the local server or a remote instance.
test_paths:
  - airline/evaluations/test_cases/airline_task_001.json
  - airline/evaluations/test_cases/airline_task_013.json
  - airline/evaluations/test_cases/airline_task_016.json
  - airline/evaluations/test_cases/airline_task_043.json
  - airline/evaluations/test_cases/airline_task_044.json
output_dir: results/smoke
# The simulated user and the judge both call the virtual model through the
# local Orchestrate AI gateway, so no separate provider key is needed.
llm_user_config:
  # v2 simulator with agentops/prompt/universal_user_template.jinja2; the v1 prompt
  # makes the simulated user answer as the agent (see docs/role-switch/).
  version: v2
  provider_config:
    provider: gateway
    model_id: virtual-model/anthropic/claude-sonnet-5-5
evaluation_config:
  provider_config:
    provider: gateway
    model_id: virtual-model/anthropic/claude-sonnet-5-5
max_user_turns: 30
num_workers: 2
